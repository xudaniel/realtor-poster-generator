[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realtor-poster"
version = "1.2.0"
description = "Deterministic, data-driven real-estate poster generator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "Pillow>=10.2,<12",
  "PyYAML>=6.0,<7",
]

[project.scripts]
realtor-poster = "realtor_poster.cli:main"
realtor-poster-preview = "realtor_poster.preview:main"
realtor-poster-visual = "realtor_poster.visual_regression:main"

[tool.setuptools.packages.find]
include = ["realtor_poster*"]
