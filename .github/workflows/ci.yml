name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip build && python -m pip install -e .
      - name: Generate deterministic sample assets
        run: python scripts/create_sample_assets.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Render release sample
        run: python generate_poster.py examples/sample_listing.yaml --output outputs/ci-sample.png --pdf --social all
      - name: Build package
        run: python -m build
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: release-sample
          path: |
            outputs/ci-sample*
            dist/*

  browser-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JavaScript syntax
        run: node --check web/core.js && node --check web/recovery.js && node --check web/app.js
      - name: Browser core and recovery tests
        run: node tests/test_web_core.js && node tests/test_web_recovery.js && node tests/test_web_layout_goldens.js
      - name: Confirm editor has no network calls or remote assets
        run: |
          ! grep -R -E "fetch\(|XMLHttpRequest|https?://" web/core.js web/recovery.js web/app.js web/index.html web/styles.css
